<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clipboard body -->
  <rect x="10" y="12" width="80" height="100" rx="5" stroke="#3b82f6"/>
  <!-- Clip at top -->
  <rect x="35" y="6" width="30" height="14" rx="5" stroke="#3b82f6"/>
  <rect x="40" y="3" width="20" height="8" rx="4" stroke="#3b82f6"/>
  <!-- Car body -->
  <rect x="22" y="30" width="56" height="30" rx="4" stroke="#3b82f6"/>
  <path d="M30 30 L38 20 L62 20 L70 30" stroke="#3b82f6"/>
  <!-- Car wheels -->
  <circle cx="33" cy="60" r="7" stroke="#3b82f6"/>
  <circle cx="67" cy="60" r="7" stroke="#3b82f6"/>
  <!-- Report lines -->
  <line x1="22" y1="80" x2="45" y2="80" stroke="#3b82f6" stroke-width="3"/>
  <line x1="22" y1="90" x2="45" y2="90" stroke="#3b82f6" stroke-width="3"/>
  <line x1="22" y1="100" x2="45" y2="100" stroke="#3b82f6" stroke-width="3"/>
  <line x1="55" y1="80" x2="78" y2="80" stroke="#3b82f6" stroke-width="3"/>
  <line x1="55" y1="90" x2="78" y2="90" stroke="#3b82f6" stroke-width="3"/>
  <line x1="55" y1="100" x2="78" y2="100" stroke="#3b82f6" stroke-width="3"/>
</svg>
