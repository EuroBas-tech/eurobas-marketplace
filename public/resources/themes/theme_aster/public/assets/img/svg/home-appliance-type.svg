<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
  <title>home-appliance-type</title>
  
  <!-- Refrigerator / Big Appliance (الثلاجة - الجهاز الكبير) -->
  <rect x="64" y="64" width="160" height="384" rx="20" />
  <!-- Fridge Door Line (خط فاصل الفريزر عن الثلاجة) -->
  <line x1="64" y1="192" x2="224" y2="192" />
  <!-- Fridge Handles (مقابض أبواب الثلاجة) -->
  <line x1="100" y1="130" x2="100" y2="160" stroke-width="20" />
  <line x1="100" y1="230" x2="100" y2="280" stroke-width="20" />

  <!-- Washing Machine / Front Load (الغسالة - الجهاز المجاور) -->
  <rect x="256" y="160" width="192" height="288" rx="20" />
  <!-- Control Panel Line (خط لوحة التحكم العلوية) -->
  <line x1="256" y1="224" x2="448" y2="224" />
  <!-- Washing Machine Door Outer Circle (باب الغسالة الدائري) -->
  <circle cx="352" cy="336" r="64" />
  <!-- Washing Machine Inner Door Window (زجاج الباب الداخلي) -->
  <circle cx="352" cy="336" r="32" fill="#3b82f6" fill-opacity="0.15" />
  <!-- Knob / Button (زر التحكم العلوي) -->
  <circle cx="296" cy="192" r="10" fill="#3b82f6" />
</svg>
