<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Piston Head (رأس الأسطوانة/المكبس) -->
  <rect x="25" y="10" width="50" height="32" rx="4" stroke="#3b82f6"/>
  
  <!-- Piston Rings (حلقات المكبس) -->
  <line x1="25" y1="18" x2="75" y2="18" stroke="#3b82f6"/>
  <line x1="25" y1="24" x2="75" y2="24" stroke="#3b82f6"/>
  <line x1="25" y1="30" x2="75" y2="30" stroke="#3b82f6"/>

  <!-- Piston Pin Circle (محبس المكبس) -->
  <circle cx="50" cy="33" r="4" fill="#3b82f6"/>

  <!-- Connecting Rod (ذراع التوصيل مائل بشكل ينبض بالحرّكة) -->
  <path d="M44 42 L36 85" stroke="#3b82f6"/>
  <path d="M56 42 L48 85" stroke="#3b82f6"/>
  <line x1="40" y1="46" x2="40" y2="81" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Crankshaft Attachment / Counterweight (عمود الكرنك السفلي) -->
  <circle cx="42" cy="88" r="10" stroke="#3b82f6"/>
  <circle cx="42" cy="88" r="4" fill="#3b82f6"/>
  <path d="M26 95 C20 80 30 65 42 65" stroke="#3b82f6"/>
</svg>
