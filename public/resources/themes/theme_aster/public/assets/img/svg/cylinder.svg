<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Three cylinders side by side -->
  <!-- Left cylinder -->
  <rect x="5" y="35" width="30" height="60" rx="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="10" y="28" width="20" height="12" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <rect x="17" y="15" width="6" height="16" rx="2" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Middle cylinder -->
  <rect x="45" y="35" width="30" height="60" rx="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="50" y="28" width="20" height="12" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <rect x="57" y="15" width="6" height="16" rx="2" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Right cylinder -->
  <rect x="85" y="35" width="30" height="60" rx="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="90" y="28" width="20" height="12" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <rect x="97" y="15" width="6" height="16" rx="2" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Base connecting line -->
  <rect x="5" y="92" width="110" height="8" rx="2" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Pistons inside cylinders -->
  <rect x="10" y="50" width="20" height="25" rx="2" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="45" width="20" height="25" rx="2" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="90" y="55" width="20" height="25" rx="2" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
</svg>
