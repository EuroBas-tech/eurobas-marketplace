<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
  <title>model-year</title>
  
  <!-- Calendar Body (جسم التقويم/الدفتر الرئيسي) -->
  <rect x="70" y="90" width="372" height="360" rx="28" />
  
  <!-- Top Header Divider (الخط الفاصل العلوي) -->
  <line x1="70" y1="180" x2="442" y2="180" />
  
  <!-- Top Binder Rings (حلقات الدفتر العلوية) -->
  <line x1="160" y1="50" x2="160" y2="100" stroke-width="20" />
  <line x1="352" y1="50" x2="352" y2="100" stroke-width="20" />
  
  <!-- Calendar Grid Dots / Days (نقاط صفوف الأيام خفيفة وواضحة) -->
  <circle cx="160" cy="260" r="12" fill="#3b82f6" />
  <circle cx="256" cy="260" r="12" fill="#3b82f6" />
  <circle cx="352" cy="260" r="12" fill="#3b82f6" />

  <circle cx="160" cy="340" r="12" fill="#3b82f6" />
  <circle cx="256" cy="340" r="12" fill="#3b82f6" />
  <circle cx="352" cy="340" r="12" fill="#3b82f6" />
</svg>
