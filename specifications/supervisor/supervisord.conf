[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=www-data:www-data

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
directory=/usr/local/etc/php
command=php-fpm --nodaemonize --allow-to-run-as-root
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:laravel-scheduler]
command=/bin/sh -c "while true; do /usr/local/bin/php /var/www/artisan schedule:run; sleep 60; done"
directory=/var/www
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-scheduler.log
stderr_logfile=/var/log/supervisor/laravel-scheduler-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7
startsecs=0

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true

stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7

startsecs=1
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
