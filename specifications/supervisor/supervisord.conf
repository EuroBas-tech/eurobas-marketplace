[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:php-fpm]
directory=/usr/local/etc/php
command=php-fpm --nodaemonize --allow-to-run-as-root
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:laravel-scheduler]
command=/bin/sh -c "while true; do /usr/local/bin/php /var/www/artisan schedule:run; sleep 60; done"
directory=/var/www
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-scheduler.log
stderr_logfile=/var/log/supervisor/laravel-scheduler-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7
startsecs=0
